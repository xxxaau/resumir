name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build i publicar release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instal·lar dependències
        run: npm ci

      - name: Comprovar que el tag coincideix amb la versió
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${V}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincideix amb la versió de package.json (v${V})" >&2
            exit 1
          fi

      - name: Build Firefox i Chromium ZIPs
        run: node scripts/build.mjs all

      - name: Prerelease audit
        run: npm run prerelease

      - name: Verificar vendors (SHA-256)
        run: npm run vendor:verify

      - name: web-ext lint (paquet Firefox real, el que es puja a AMO)
        run: |
          mkdir -p build/lint-firefox
          unzip -q "build/resumir-contingut-${GITHUB_REF_NAME}-firefox.zip" -d build/lint-firefox
          npx --yes web-ext@10.7.0 lint --source-dir build/lint-firefox

      - name: Crear GitHub Release amb els ZIPs
        uses: softprops/action-gh-release@v3
        with:
          files: build/resumir-contingut-*.zip
          body: |-
            ## Instal·lació

            ### Firefox
            L'extensió es distribueix via Mozilla Add-ons:
            https://addons.mozilla.org/en-US/firefox/addon/resumir

            ### Chrome / Edge / Brave
            1. Baixa el fitxer `resumir-contingut-${{ github.ref_name }}-chromium.zip` dels fitxers adjunts
            2. Descomprimeix-lo en una carpeta
            3. Obre `chrome://extensions`, activa el «Mode de desenvolupador»
            4. Fes clic a «Carrega extensió desempaquetada» i selecciona la carpeta

            ---

            ## Novetats de la versió
          generate_release_notes: true
