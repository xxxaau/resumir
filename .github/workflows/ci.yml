name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint i tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instal·lar dependències de dev
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests unitaris
        run: npm test

      - name: Build (Firefox + Chromium)
        run: npm run build

      - name: Pre-release check
        run: npm run prerelease

      - name: Verificar vendors
        run: npm run vendor:verify

      - name: web-ext lint (paquet Firefox real, el que es puja a AMO)
        if: runner.os == 'Linux'
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p build/lint-firefox
          unzip -q "build/resumir-contingut-v${VER}-firefox.zip" -d build/lint-firefox
          npx --yes web-ext@10.7.0 lint --source-dir build/lint-firefox

      - name: Manifests regenerats = manifests versionats (no s'editen a mà)
        if: runner.os == 'Linux'
        run: |
          npm run manifests:gen
          git diff --exit-code -- manifest.json manifest.chromium.json
